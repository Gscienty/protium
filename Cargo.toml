[package]
name = "protium"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.84"
console_error_panic_hook = { version = "0.1.7", optional = true }
wasm-bindgen-futures = "0.4.50"
web-sys = { version = "0.3.77", features = [
  "Window",
  "CssStyleDeclaration",
  "Document",
  "Element",
  "HtmlAnchorElement",
  "HtmlCanvasElement",
  "WebGlBuffer",
  "WebGlRenderbuffer",
  "WebGl2RenderingContext",
  "WebGlProgram",
  "WebGlShader",
  "WebGlUniformLocation",
  "WebGlFramebuffer",
  "WebGlTexture",
  "Url",
  "WebGlVertexArrayObject",
  "WebGlTransformFeedback",
  "WebGlContextAttributes",
  "Performance",
  "MediaStream",
  "CanvasCaptureMediaStream",
  "MediaRecorder",
  "MediaRecorderOptions",
  "Blob",
  "BlobEvent",
  "BlobPropertyBag",
  "EventTarget",
  "MediaRecorderErrorEvent",
  "KeyboardEvent",
  "EventListener",
  "MouseEvent",
] }
