[package]
name = "protium"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tokio = { version = "1.43.0", features = ["sync", "rt", "time"] }
tokio_with_wasm = { version = "0.9.0", features = [
  "rt",
  "rt-multi-thread",
  "sync",
  "time",
] }
wasm-bindgen = "0.2.84"
console_error_panic_hook = "0.1.7"
wasm-bindgen-futures = "0.4.50"
web-sys = { version = "0.3.77", features = [
  "Window",
  "CssStyleDeclaration",
  "Document",
  "Element",
  "HtmlAnchorElement",
  "HtmlCanvasElement",
  "WebGlBuffer",
  "WebGlRenderbuffer",
  "WebGl2RenderingContext",
  "WebGlProgram",
  "WebGlShader",
  "WebGlUniformLocation",
  "WebGlFramebuffer",
  "WebGlTexture",
  "Url",
  "WebGlVertexArrayObject",
  "WebGlTransformFeedback",
  "WebGlContextAttributes",
  "Performance",
  "MediaStream",
  "CanvasCaptureMediaStream",
  "MediaRecorder",
  "MediaRecorderOptions",
  "Blob",
  "BlobEvent",
  "BlobPropertyBag",
  "EventTarget",
  "MediaRecorderErrorEvent",
  "KeyboardEvent",
  "EventListener",
  "MouseEvent",
] }
lazy_static = "1.5.0"
chrono = "0.4.42"
enum-flags = "0.4.0"
strum = { version = "0.27.2", features = ["derive"] }
fontdue = "0.9.3"
reqwest-wasm = "0.11.16"
